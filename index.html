<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a1017">
    <title>IRONFALL | NEO</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0a1017; overflow: hidden; }
      #game {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #canvas-parent { width: 100%; height: 100%; touch-action: none; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <main id="game" aria-label="IRONFALL by NEO"><div id="canvas-parent"></div></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
